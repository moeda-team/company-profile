services:
  web:
    image: company-fe-service:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - nodeworks
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

networks:
  nodeworks:
    external: true
    name: nodeworks
